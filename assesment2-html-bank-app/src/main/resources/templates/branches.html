<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Branches</title>
    <style>
        table { border-collapse: collapse; width: 60%; }
        th, td { border: 1px solid black; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<h1 th:text="${bankName}"></h1>
<h2>Branches in Bangalore</h2>

<table>
    <tr>
        <th>Branch Name</th>
    </tr>
    <tr th:each="branch : ${branches}">
        <td th:text="${branch}"></td>
    </tr>
</table>

</body>
</html>
