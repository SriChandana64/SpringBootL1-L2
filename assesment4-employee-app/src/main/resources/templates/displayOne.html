<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Details</title>
</head>
<body>

<h2>Employee Details</h2>

<div th:if="${employee != null}">
    ID: <span th:text="${employee.employeeId}"></span><br>
    Name: <span th:text="${employee.employeeName}"></span><br>
    Email: <span th:text="${employee.employeeEmail}"></span><br>
    Location: <span th:text="${employee.location}"></span><br>
</div>

<div th:if="${employee == null}">
    <p>Employee not found!</p>
</div>

<br>
<a href="/">Back</a>

</body>
</html>
