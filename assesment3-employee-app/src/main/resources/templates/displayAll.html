<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Employees</title>
</head>
<body>

<h2>All Employees</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Location</th>
    </tr>

    <tr th:each="emp : ${employees}">
        <td th:text="${emp.employeeId}"></td>
        <td th:text="${emp.employeeName}"></td>
        <td th:text="${emp.employeeEmail}"></td>
        <td th:text="${emp.location}"></td>
    </tr>
</table>

<br>
<a href="/">Back to Form</a>

</body>
</html>
